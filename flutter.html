<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flutter — Meta</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
main{max-width:800px;margin:0 auto;padding:28px 20px 70px}
.back{display:inline-block;color:#555;text-decoration:none;margin-bottom:28px;font-size:15px}
h1{margin:0 0 7px;font-size:32px;letter-spacing:-.8px}p{margin:0;color:#777;font-size:15px}
section{margin-top:38px}h2{font-size:18px;font-weight:600;margin:0 0 14px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.lesson{background:transparent;border:1px solid #e6e6e6;text-align:left;padding:17px 16px;min-height:72px;display:flex;align-items:center;gap:14px;border-radius:0;font:inherit;color:inherit}
.lesson.completed{background:#dcfce7;border-color:#86d6a0;color:#14532d}
.lesson.completed .code{color:#166534}
.lesson{text-decoration:none;cursor:pointer}
.lesson:hover{border-color:#a3a3a3}
.lesson:focus-visible{outline:2px solid #111;outline-offset:3px}
.code{font-size:13px;color:#888;min-width:32px;font-variant-numeric:tabular-nums}
.name{font-size:15px;line-height:1.45}
.status{color:#777;margin-top:20px}
@media(max-width:580px){main{padding-top:25px}h1{font-size:29px}.list{grid-template-columns:1fr}}

/* Module progress cards use the same spacing and bar height as the homepage. */
main{max-width:688px;padding-left:24px;padding-right:24px}
section.module{margin-top:0}
.modules{display:flex;flex-direction:column;gap:18px}
.module-toggle{display:block;width:100%;background:transparent;color:inherit;border:0;border-radius:0;padding:0;text-align:left;font:inherit;cursor:pointer}
.module-toggle:hover .module-name{text-decoration:underline}
.module-toggle:focus-visible{outline:2px solid #111;outline-offset:4px}
.module-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px;font-size:18px;line-height:1.4}
.module-name{font-weight:600}
.module-count{font-variant-numeric:tabular-nums;white-space:nowrap}
.module-track{height:18px;margin:0 24px;background:#e5e7eb}
.module-fill{height:100%;background:#111}
.module-lessons{margin:18px 24px 4px}
.module-lessons[hidden]{display:none}
header{margin-bottom:26px}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.page-top .back{margin-bottom:0}
.next{padding:11px 12px;margin:0 0 24px;border-left:2px solid #111;color:#111;font-size:14px;line-height:1.65}
.next strong{margin-right:7px}
.next a{color:#111;font-weight:600}

</style>
<link rel="stylesheet" href="./meta-ui.css?v=6">
</head>
<body class="meta-ui" data-course="flutter">
<div class="meta-shell-placeholder" aria-hidden="true"></div>
<main class="meta-shell meta-lesson">
<nav class="page-top meta-page-nav" aria-label="Навигация Flutter"><a class="back" id="home-link" href="./">← Мои программы</a><a class="back" href="./support.html">Сообщения</a><a id="user-link" class="back" href="./account.html">Войти</a></nav>
<header><h1>Flutter</h1><p id="catalog-summary">Проверяю доступ к программе…</p></header>
<p id="next" class="next" hidden aria-live="polite"></p>
<div id="catalog" aria-live="polite"><p class="status">Загрузка уроков…</p></div>
</main>
<script type="module">
import {supabase,authenticatedUser,authPage} from "./meta-supabase.js";
import {language} from "./meta-language.js?v=3";
import {loadAttemptedLessons,lessonStatus} from "./meta-course-state.js";
let attempted=null;
// Course material is read only with the authenticated user's RLS-protected session.
const completedLessonIds=new Set();
const isEnglish=language()==="en";
const modules=[
{prefix:"D",title:"Dart и модель данных"},
{prefix:"U",title:"Flutter UI"},
{prefix:"S",title:"Состояние и действия"},
{prefix:"N",title:"Сеть и асинхронность"},
{prefix:"P",title:"Постоянное хранение"},
{prefix:"E",title:"Инженерная работа"},
{prefix:"C",title:"Самостоятельный перенос"}
];
async function loadCatalog(){
const root=document.getElementById("catalog");
try{
const user=await authenticatedUser();
if(!user){location.replace(authPage("./flutter.html"));return;}
document.getElementById("user-link").textContent=isEnglish?"Profile":"Профиль";
document.getElementById("user-link").href="./profile.html";
document.getElementById("home-link").textContent=isEnglish?"← My courses":"← Мои программы";
const {data:rawLessons,error:catalogError}=await supabase.from("lessons")
  .select("id,external_id,title,title_en,sort_order")
  .eq("course_slug","flutter").order("sort_order",{ascending:true});
if(catalogError)throw catalogError;
if(!rawLessons?.length){
 root.replaceChildren();
 const p=document.createElement("p");p.className="status";
 p.textContent="Эта учебная программа не назначена твоему аккаунту.";
 const link=document.createElement("a");link.href="./";link.textContent="Мои программы";
 root.append(p,link);
 document.getElementById("catalog-summary").textContent="Нет доступа к программе";
 return;
}
if(rawLessons.length!==56)throw new Error("Неполный каталог");
const lessons=rawLessons.map(x=>({...x,title:language()==="en"?(x.title_en||x.title):x.title}));
root.replaceChildren();
root.className="modules";
completedLessonIds.clear();
const {data:progress,error}=await supabase.from("lesson_progress")
 .select("lesson_id").eq("user_id",user.id);
if(error)throw error;
attempted=await loadAttemptedLessons(user.id);
const map=new Map(lessons.map(l=>[l.id,l.external_id]));
for(const record of progress||[])if(map.has(record.lesson_id))completedLessonIds.add(map.get(record.lesson_id));
document.getElementById("catalog-summary").textContent=isEnglish
  ?"56 micro-lessons · 7 modules · "+completedLessonIds.size+" completed"
  :"56 микроуроков · 7 модулей · "+completedLessonIds.size+" выполнено";
const first=lessons.find(l=>!completedLessonIds.has(l.external_id));
const next=document.getElementById("next");
next.replaceChildren();next.hidden=false;
if(first){
 const lead=document.createElement("strong");
 lead.textContent=completedLessonIds.size ? (isEnglish?"Continue learning: ":"Продолжить обучение: ") : (isEnglish?"Start first lesson: ":"Начать первый урок: ");
 const a=document.createElement("a");
 a.href="./flutter-lesson.html?id="+encodeURIComponent(first.external_id);
 a.textContent=first.title+" →";
 next.append(lead,a);
}else{
 next.textContent=isEnglish?"All Flutter micro-lessons completed.":"Все микроуроки Flutter пройдены.";
}

for(const mod of modules){
 const group=lessons.filter(x=>x.external_id.startsWith(mod.prefix));
 const done=group.filter(x=>completedLessonIds.has(x.external_id)).length;
 const section=document.createElement("section");section.className="module";
 const toggle=document.createElement("button");toggle.type="button";toggle.className="module-toggle";
 const heading=document.createElement("div");heading.className="module-heading";
 const name=document.createElement("span");name.className="module-name";name.textContent=isEnglish?({D:"Dart & data modelling",U:"Flutter UI",S:"State & actions",N:"Networking & async",P:"Persistent storage",E:"Engineering",C:"Independent application"}[mod.prefix]||mod.title):mod.title;
 const count=document.createElement("span");count.className="module-count";count.textContent=done+" / "+group.length;
 heading.append(name,count);
 const track=document.createElement("div");track.className="module-track";
 const fill=document.createElement("div");fill.className="module-fill";
 fill.style.width=(group.length?100*done/group.length:0)+"%";
 track.append(fill);toggle.append(heading,track);
 const content=document.createElement("div");content.className="module-lessons";
 content.id="module-"+mod.prefix;content.hidden=true;
 toggle.setAttribute("aria-controls",content.id);
 toggle.setAttribute("aria-expanded","false");
 const list=document.createElement("div");list.className="list";
 for(const lesson of group){
  const tile=document.createElement("a");tile.className=completedLessonIds.has(lesson.external_id)?"lesson completed":"lesson";
  tile.href="./flutter-lesson.html?id="+encodeURIComponent(lesson.external_id);
  tile.setAttribute("aria-label",lesson.external_id+" — "+lesson.title+(completedLessonIds.has(lesson.external_id)?" (пройден)":""));
  const id=document.createElement("span");id.className="code";id.textContent=lesson.external_id;
  const label=document.createElement("span");label.className="name";label.textContent=lesson.title;
  const status=document.createElement("span");status.className="meta-lesson-status";status.textContent=lessonStatus(completedLessonIds.has(lesson.external_id),attempted,lesson.id);tile.append(id,label,status);list.append(tile);
 }
 content.append(list);
 toggle.addEventListener("click",()=>{
  content.hidden=!content.hidden;
  toggle.setAttribute("aria-expanded",String(!content.hidden));
 });
 section.append(toggle,content);root.append(section);
 if(location.hash==="#module-"+mod.prefix){
  content.hidden=false;
  toggle.setAttribute("aria-expanded","true");
  requestAnimationFrame(()=>section.scrollIntoView({block:"start"}));
 }
}
}catch(error){
root.replaceChildren();
const p=document.createElement("p");p.className="status";p.textContent="Не удалось загрузить уроки. Обнови страницу позже.";root.append(p);
console.error("Flutter catalog:",error);
}
}
loadCatalog();
</script>
<script type="module" src="./meta-language.js?v=3"></script>
<script type="module" src="./meta-shell.js?v=2"></script>
</body>
</html>
