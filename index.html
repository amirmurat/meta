<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Meta — Мои программы</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent;color:#111;font-family:Arial,Helvetica,sans-serif}
main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:70px 24px}
header{width:min(100%,640px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px}
h1{margin:0;font-size:24px;letter-spacing:-.4px}
.nav-links{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.profile{font-size:14px;text-decoration:none;color:#555}.profile:hover{text-decoration:underline}
.courses{width:min(100%,640px);display:flex;flex-direction:column;gap:24px}
.course{display:block;text-decoration:none;color:inherit;width:100%;background:transparent}
.course:not([href]){cursor:default}
.course[href]:hover .name{text-decoration:underline}
.course[href]:focus-visible{outline:2px solid #111;outline-offset:4px}
.course-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px;font-size:18px;line-height:1.4}
.name{font-weight:600}.count{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:18px;margin:0 24px;background:#e5e7eb}
.fill{height:100%;background:#111;width:0}
.small{width:min(100%,640px);padding:0 24px;font-size:14px;line-height:1.65;color:#777}
.empty{width:min(100%,640px);padding:22px 24px}
.empty p{color:#666;font-size:16px;line-height:1.65;margin:0 0 16px}
.empty a{font-size:15px;color:#111}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header id="heading" hidden><h1>Мои программы</h1><div class="nav-links"><a class="profile" href="./statistics.html">Статистика</a><a class="profile" href="./profile.html">Профиль</a></div></header>
<p class="small" id="loading">Проверяю вход…</p>
<div class="courses" id="courses" hidden></div>
<div class="empty" id="empty" hidden>
<p>Пока у тебя нет назначенных программ. Укажи свою цель в профиле. После этого можно будет подобрать или создать учебный маршрут.</p>
<a href="./profile.html">Указать цель</a>
</div>
<p class="small" id="notice" hidden></p>
</main>
<script type="module">
import {supabase,authenticatedUser} from "./meta-supabase.js";
import {language} from "./meta-language.js";
const $=id=>document.getElementById(id);
async function main(){
 try{
  const user=await authenticatedUser();
  if(!user){location.replace("./account.html?next="+encodeURIComponent("./"));return;}
  const {data:assigned,error:assignedError}=await supabase.from("course_enrollments")
    .select("course_slug").eq("user_id",user.id);
  if(assignedError)throw assignedError;
  $("loading").hidden=true;$("heading").hidden=false;
  if(!assigned?.length){$("empty").hidden=false;return;}
  const [catalog,lessons,progress]=await Promise.all([
   supabase.from("courses").select("slug,title,title_en,total_units"),
   supabase.from("lessons").select("id,course_slug"),
   supabase.from("lesson_progress").select("lesson_id").eq("user_id",user.id)
  ]);
  for(const result of [catalog,lessons,progress])if(result.error)throw result.error;
  const assignedSlugs=new Set(assigned.map(x=>x.course_slug));
  const visible=(catalog.data||[]).filter(c=>assignedSlugs.has(c.slug));
  const lessonCourse=new Map((lessons.data||[]).map(l=>[l.id,l.course_slug]));
  const counts=new Map();
  for(const row of progress.data||[]){
    const slug=lessonCourse.get(row.lesson_id);
    if(slug)counts.set(slug,(counts.get(slug)||0)+1);
  }
  const root=$("courses");
  for(const course of visible){
    const canOpen=course.slug==="flutter"||course.slug==="ielts";
    const card=document.createElement(canOpen?"a":"div");
    card.className="course";
    if(course.slug==="flutter")card.href="./flutter.html";
    if(course.slug==="ielts")card.href="./ielts.html";
    const top=document.createElement("div");top.className="course-top";
    const title=document.createElement("span");title.className="name";title.textContent=language()==="en"?(course.title_en||course.title):course.title;
    const amount=document.createElement("span");amount.className="count";
    const done=counts.get(course.slug)||0;
    amount.textContent=done+" / "+course.total_units;
    top.append(title,amount);
    const track=document.createElement("div");track.className="track";
    track.setAttribute("role","progressbar");track.setAttribute("aria-label",language()==="en"?(course.title_en||course.title):course.title);
    track.setAttribute("aria-valuemin","0");track.setAttribute("aria-valuemax",String(course.total_units));
    track.setAttribute("aria-valuenow",String(done));
    const fill=document.createElement("div");fill.className="fill";
    fill.style.width=(100*done/course.total_units)+"%";
    track.append(fill);card.append(top,track);root.append(card);
  }
  if(!root.children.length){$("empty").hidden=false;return;}
  root.hidden=false;
  if(visible.some(c=>c.slug==="quran")){
    $("notice").textContent="Для Корана пока доступен счётчик; страница изучения аятов появится позже.";
    $("notice").hidden=false;
  }
 }catch(e){
  console.error("Meta dashboard:",e);
  $("loading").textContent="Не удалось загрузить твои программы. Обнови страницу или проверь вход в аккаунт.";
 }
}
void main();
</script>
<script type="module" src="./meta-language.js"></script>
</body>
</html>
