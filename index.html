<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Meta — Learning Progress</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }

    .progress {
      width: min(100%, 640px);
      background: transparent;
      overflow: hidden;
    }

    .flutter-link { display: block; color: inherit; text-decoration: none; cursor: pointer; }
    .flutter-link:hover .progress-label { text-decoration: underline; }
    .flutter-link:focus-visible { outline: 2px solid #111; outline-offset: 4px; }

    .account-nav { position:fixed;top:22px;right:26px;font-size:14px;color:#555;text-decoration:none;z-index:1; }
    .account-nav:hover { text-decoration:underline; }
    .progress-context { width:min(100%,640px);padding:0 24px;font-size:12px;color:#777;line-height:1.5; }
    .progress-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      font-size: 18px;
      line-height: 1.4;
    }

    .progress-label { font-weight: 600; }

    .progress-count {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .progress-track {
      height: 18px;
      margin: 0 24px;
      background: #e5e7eb;
    }

    .progress-fill {
      width: 0.903614%;
      height: 100%;
      background: #111111;
    }

    .progress-fill.flutter {
      width: 28.571429%;
    }

    .progress-fill.quran {
      width: 0.625401%;
    }
  </style>
</head>
<body>
  <a class="account-nav" id="account-nav" href="./account.html">Войти</a>
  <main>
    <section class="progress" aria-label="IELTS: 3 из 332 уроков выполнено">
      <div class="progress-content">
        <span class="progress-label">IELTS</span>
        <span class="progress-count">3 / 332</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Завершённые уроки IELTS" aria-valuemin="0" aria-valuemax="332" aria-valuenow="3">
        <div class="progress-fill"></div>
      </div>
    </section>
    <a href="./flutter.html" class="progress flutter-link" aria-label="Открыть курс Flutter, 16 из 56 уроков выполнено">
      <div class="progress-content">
        <span class="progress-label">Flutter</span>
        <span class="progress-count">16 / 56</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Завершённые уроки Flutter" aria-valuemin="0" aria-valuemax="56" aria-valuenow="16">
        <div class="progress-fill flutter"></div>
      </div>
    </a>
    <section class="progress" aria-label="Коран: подтверждено последовательное изучение 39 из 6236 аятов">
      <div class="progress-content">
        <span class="progress-label">Коран</span>
        <span class="progress-count">39 / 6236</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Последовательно изученные аяты Корана" aria-valuemin="0" aria-valuemax="6236" aria-valuenow="39">
        <div class="progress-fill quran"></div>
      </div>
    </section>
    <p class="progress-context" id="progress-context">Показана прежняя сводка обучения. Войди, чтобы видеть личный прогресс.</p>
  </main>
<script type="module">
import {supabase,authenticatedUser} from "./meta-supabase.js";
try {
 const user=await authenticatedUser();
 if(user){
  const nav=document.getElementById("account-nav");
  nav.textContent="Мой профиль";
  nav.href="./profile.html";
  const [progressResult,lessonResult]=await Promise.all([
    supabase.from("lesson_progress").select("lesson_id").eq("user_id",user.id),
    supabase.from("lessons").select("id,course_slug")
  ]);
  if(progressResult.error)throw progressResult.error;
  if(lessonResult.error)throw lessonResult.error;
  const byId=new Map((lessonResult.data||[]).map(l=>[l.id,l.course_slug]));
  const counts={ielts:0,flutter:0,quran:0};
  for(const item of progressResult.data||[]){
    const course=byId.get(item.lesson_id);
    if(course&&course in counts) counts[course]++;
  }
  const metas=[["ielts",332],["flutter",56],["quran",6236]];
  const sections=[...document.querySelectorAll(".progress")];
  metas.forEach(([slug,total],i)=>{
    const section=sections[i],done=counts[slug];
    section.querySelector(".progress-count").textContent=done+" / "+total;
    section.querySelector(".progress-fill").style.width=100*done/total+"%";
    section.querySelector(".progress-track").setAttribute("aria-valuenow",String(done));
    section.setAttribute("aria-label",slug+": "+done+" из "+total+" выполнено");
  });
  document.getElementById("progress-context").textContent="Это личные результаты твоего аккаунта. Старый прогресс из Google Drive пока не перенесён.";
 }
}catch(error){console.error("Meta progress:",error)}
</script>
</body>
</html>
